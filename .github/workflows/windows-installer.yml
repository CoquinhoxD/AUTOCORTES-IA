name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - '.github/workflows/windows-installer.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Test and compile
        shell: pwsh
        run: |
          npm test --prefix backend -- --silent
          npm test --prefix frontend -- --watch=false --silent
          npm run build --prefix backend
          npm run build --prefix frontend
      - name: Prepare FFmpeg
        run: npm run fetch-ffmpeg --prefix desktop
      - name: Build Windows installer
        run: npm run dist --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralCutAI-Windows-Setup
          path: desktop/release/*Setup.exe
          if-no-files-found: error
          retention-days: 14
